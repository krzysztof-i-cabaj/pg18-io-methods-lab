# ==============================================================================
# Tytul:        tests.conf
# Opis:         Definicje testow T1-T3: id | oczekiwany wezel planu | ustawienia sesji | zapytanie.
#               Jedno zrodlo dla kontroli planow (plan_check.sh) i pomiarow (etap 3).
#               Test bez oczekiwanego wezla = FAIL, wynik nie trafia do raportu.
# Description [EN]: Test definitions T1-T3: id | expected plan node | session GUCs | query.
#               Single source for plan check and measurements. Missing node = FAIL.
#
# Autor:        KCB Kris
# Data:         2026-10-15
# Wersja:       1.0
# Konwencje:    <repo>/SETTINGS.md
#
# Wymagania [PL]:    - tabela fakty (sql/01_create_test_data.sql)
# Requirements [EN]: - table fakty
#
# Uzycie [PL]:       .\lab.ps1 plans
# Usage [EN]:        .\lab.ps1 plans
# ==============================================================================
T1a|Seq Scan|SET max_parallel_workers_per_gather = 0;|SELECT count(*), avg(v) FROM fakty
T1b|Parallel Seq Scan||SELECT count(*), avg(v) FROM fakty
# T2: 1 dzien (~54,5 tys. wierszy). Planer wybiera Bitmap Heap Scan naturalnie tylko dla 1 dnia;
#     3-14 dni = Index Scan, >= 30 dni = Seq Scan (EXPLAIN 2026-10-15, random_page_cost=4). Bez wymuszania planu.
T2|Bitmap Heap Scan|SET max_parallel_workers_per_gather = 0;|SELECT count(*), avg(v) FROM fakty WHERE d = '2022-03-01'
T3|Index Scan|SET max_parallel_workers_per_gather = 0;|SELECT sum(v) FROM (SELECT v FROM fakty WHERE r >= 500000000000 ORDER BY r LIMIT 5000) s
